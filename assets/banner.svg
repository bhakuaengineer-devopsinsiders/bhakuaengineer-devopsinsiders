<svg width="100%" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="20%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9333EA" stop-opacity="1" />
      <stop offset="80%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.85; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(1000px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .hud-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      letter-spacing: 5px;
      fill: url(#textGrad);
    }
    .hud-sub {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 13px;
      letter-spacing: 3px;
      font-weight: 700;
      fill: #38BDF8;
    }
    .hud-tag {
      font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
      font-size: 10.5px;
      fill: #94A3B8;
      letter-spacing: 1.5px;
    }
    .hud-status {
      font-family: 'Fira Code', monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #10B981;
      letter-spacing: 1px;
    }
    .glow-pulse {
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .blink-dot {
      animation: blink 2s ease-in-out infinite;
    }
    .grid-path {
      stroke: #1E293B;
      stroke-width: 0.8;
      stroke-opacity: 0.45;
    }
    .corner-bracket {
      stroke: #00F2FE;
      stroke-width: 2.2;
      fill: none;
    }
  </style>

  <!-- Container Base with Cyber Border -->
  <rect x="2" y="2" width="996" height="236" rx="14" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <!-- Background Cyber Isometric Grid -->
  <g class="grid-path">
    <!-- Horizontal Scanlines -->
    <line x1="20" y1="35" x2="980" y2="35" />
    <line x1="20" y1="75" x2="980" y2="75" />
    <line x1="20" y1="115" x2="980" y2="115" />
    <line x1="20" y1="155" x2="980" y2="155" />
    <line x1="20" y1="195" x2="980" y2="195" />

    <!-- Vertical Circuit Lines -->
    <line x1="70" y1="20" x2="70" y2="220" />
    <line x1="220" y1="20" x2="220" y2="220" />
    <line x1="500" y1="20" x2="500" y2="220" />
    <line x1="780" y1="20" x2="780" y2="220" />
    <line x1="930" y1="20" x2="930" y2="220" />
  </g>

  <!-- Ambient Hologram Glows -->
  <circle cx="260" cy="50" r="140" fill="#00F2FE" opacity="0.08" filter="url(#neonBlur)" class="glow-pulse" />
  <circle cx="750" cy="80" r="160" fill="#9333EA" opacity="0.09" filter="url(#neonBlur)" class="glow-pulse" />

  <!-- High-Tech Corner Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" class="corner-bracket" />
  <path d="M 984 34 L 984 16 L 966 16" class="corner-bracket" />
  <path d="M 16 206 L 16 224 L 34 224" class="corner-bracket" />
  <path d="M 984 206 L 984 224 L 966 224" class="corner-bracket" />

  <!-- Top HUD Status Telemetry Header -->
  <g transform="translate(40, 24)">
    <circle cx="6" cy="6" r="4.5" fill="#10B981" class="blink-dot" />
    <circle cx="6" cy="6" r="8" stroke="#10B981" stroke-width="1.2" opacity="0.4" />
    <text x="22" y="10" class="hud-status">SRE CONTROL PLANE: ONLINE // REGION: AZURE-MULTI-ZONE // ZERO-TRUST: ENFORCED</text>
    <text x="890" y="10" class="hud-tag" text-anchor="end">SYS.REV v4.9.2</text>
  </g>

  <!-- Main Hero Title & Identity -->
  <g transform="translate(50, 92)">
    <text x="0" y="0" class="hud-title">BHAKUA ENGINEER</text>
    <text x="2" y="32" class="hud-sub">PRINCIPAL CLOUD ARCHITECT &bull; ENTERPRISE DEVSECOPS &bull; AGENTIC AI (MCP)</text>
    <text x="2" y="58" class="hud-tag">ZERO-TRUST CLOUD ADOPTION (CAF) &bull; 100+ ENTERPRISE MIGRATIONS &bull; AUTONOMOUS SRE SWARMS</text>
  </g>

  <!-- Neon Glowing Separator Circuit -->
  <line x1="40" y1="172" x2="960" y2="172" stroke="url(#lineGrad)" stroke-width="2" filter="url(#neonBlur)" />

  <!-- Bottom Metric Telemetry Pills -->
  <g transform="translate(48, 190)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1" />
    <circle cx="14" cy="14" r="3.5" fill="#38BDF8" />
    <text x="26" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">100+ CLOUD WORKLOADS</text>

    <!-- Pill 2 -->
    <rect x="206" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#7C3AED" stroke-width="1" />
    <circle cx="220" cy="14" r="3.5" fill="#A78BFA" />
    <text x="232" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">MODEL CONTEXT (MCP)</text>

    <!-- Pill 3 -->
    <rect x="412" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#059669" stroke-width="1" />
    <circle cx="426" cy="14" r="3.5" fill="#34D399" />
    <text x="438" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">TERRAFORM &amp; CILIUM</text>

    <!-- Pill 4 -->
    <rect x="618" y="0" width="190" height="28" rx="6" fill="#0F172A" stroke="#D97706" stroke-width="1" />
    <circle cx="632" cy="14" r="3.5" fill="#FBBF24" />
    <text x="644" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#E2E8F0" font-weight="600">FINOPS: -32% OPEX</text>

    <!-- Pill 5 -->
    <rect x="824" y="0" width="80" height="28" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" />
    <circle cx="838" cy="14" r="3.5" fill="#10B981" />
    <text x="848" y="18" font-family="'Fira Code', monospace" font-size="10.5" fill="#10B981" font-weight="700">99.999%</text>
  </g>
</svg>
